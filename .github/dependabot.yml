version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          security:
              applies-to: security-updates
              patterns: ['*']
          minor-and-patch:
              applies-to: version-updates
              update-types: [minor, patch]
              patterns: ['*']
      ignore:
          # major versions of LangChain, the AI SDKs and React change APIs; update them by hand
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
