name: CodeQL

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '17 4 * * 1'

permissions:
    contents: read

jobs:
    analyze:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        permissions:
            security-events: write
            contents: read
        steps:
            - uses: actions/checkout@v6
            - uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript
                  config: |
                      paths-ignore:
                          - '**/*.test.ts'
                          - '**/*.test.js'
                          - '**/node_modules'
                          - packages/server/marketplaces
            - uses: github/codeql-action/analyze@v4
