version: '3.1'

services:
    redis:
        image: redis:alpine
        container_name: keelflow-redis
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        networks:
            - keelflow-net

    keelflow:
        container_name: keelflow-main
        build:
            context: .. # Build using the Dockerfile in the root directory
            dockerfile: Dockerfile
        ports:
            - '${PORT}:${PORT}'
        volumes:
            # Mount local .keelflow to container's default location.
            # Container runs as the non-root `node` user, whose home is /home/node.
            # Ensure the host directory is writable by that user (e.g. `chown -R 1000:1000 ../.keelflow` on Linux hosts).
            - ../.keelflow:/home/node/.keelflow
        environment:
            # --- Essential Keelflow vars ---
            - PORT=${PORT:-3000}
            - DATABASE_PATH=/home/node/.keelflow
            - SECRETKEY_PATH=/home/node/.keelflow
            - LOG_PATH=/home/node/.keelflow/logs
            - BLOB_STORAGE_PATH=/home/node/.keelflow/storage
            # --- Queue Vars (Main Instance) ---
            - MODE=queue
            - QUEUE_NAME=flowise-queue # Ensure this matches worker
            - REDIS_URL=redis://redis:6379 # Use service name 'redis'
        depends_on:
            - redis
        networks:
            - keelflow-net

    keelflow-worker:
        container_name: keelflow-worker
        build:
            context: .. # Build context is still the root
            dockerfile: Dockerfile
        command: ["worker"]
        volumes:
            # Mount same local .keelflow to worker.
            # Container runs as the non-root `node` user, whose home is /home/node.
            - ../.keelflow:/home/node/.keelflow
        environment:
            # --- Essential Keelflow vars ---
            - DATABASE_PATH=/home/node/.keelflow
            - SECRETKEY_PATH=/home/node/.keelflow
            - LOG_PATH=/home/node/.keelflow/logs
            - BLOB_STORAGE_PATH=/home/node/.keelflow/storage
            # --- Queue Vars (Main Instance) ---
            - MODE=queue
            - QUEUE_NAME=flowise-queue # Ensure this matches worker
            - REDIS_URL=redis://redis:6379 # Use service name 'redis'
        depends_on:
            - redis
            - keelflow
        networks:
            - keelflow-net

volumes:
    redis_data:
        driver: local

networks:
    keelflow-net:
        driver: bridge
